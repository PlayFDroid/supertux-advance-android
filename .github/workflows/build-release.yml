name: Build SuperTux Advance Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK and SDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build zip curl ffmpeg

      - name: Build Android APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          chmod +x setup-deps.sh build-android.sh
          ./build-android.sh all

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supertuxadvance-apk
          path: supertuxadvance.apk

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: supertuxadvance.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
